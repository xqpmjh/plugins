<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1d2129; --muted: #5c6370; --line: #d9dde3;
    --panel: #f6f7f9; --accent: #2457c5;
    --ok: #1e7a3c; --ok-bg: #e3f4e8; --warn: #8a5a00; --warn-bg: #fdf1d6;
    --no: #b3261e; --no-bg: #fbe4e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c; --fg: #e4e6eb; --muted: #a0a6b1; --line: #343944;
      --panel: #1e2128; --accent: #7aa2ff;
      --ok: #7fd59a; --ok-bg: #173523; --warn: #f0c56a; --warn-bg: #3a2f12;
      --no: #ff9a92; --no-bg: #3d1b19;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 48px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; line-height: 1.3; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; }
  h3 { font-size: 1rem; margin: 18px 0 8px; }
  .meta { color: var(--muted); font-size: .9rem; margin: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .callout { border-left: 4px solid var(--accent); padding: 8px 14px; margin: 12px 0; background: var(--panel); }
  .table-wrap { overflow-x: auto; }
  table, .table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  .badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: .82rem; font-weight: 600; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.no { color: var(--no); background: var(--no-bg); }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9em; }
  pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
  svg { max-width: 100%; height: auto; }
  svg text { fill: var(--fg); font-size: 13px; }
  svg .edge { stroke: var(--muted); fill: none; stroke-width: 1.5; }
  svg .edge.unconfirmed { stroke-dasharray: 5 4; }
  svg .node { fill: var(--panel); stroke: var(--line); }
  .evidence h3 { margin-top: 0; }
  .evidence ul { margin: 0; padding-left: 1.2em; }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{TITLE}}</h1>
    <p class="meta">来源：{{SOURCE}} · 生成日期：{{DATE}} · 本页由模型生成，用作正文的补充，不构成独立证据</p>
  </header>

  {{CONTENT}}

  <section aria-labelledby="evidence-title">
    <h2 id="evidence-title">证据清单</h2>
    <div class="grid evidence">
      <div class="panel"><h3><span class="badge ok">已观察</span></h3><ul>{{EVIDENCE_OBSERVED}}</ul></div>
      <div class="panel"><h3><span class="badge warn">假设</span></h3><ul>{{EVIDENCE_ASSUMED}}</ul></div>
      <div class="panel"><h3><span class="badge no">未确定</span></h3><ul>{{EVIDENCE_UNKNOWN}}</ul></div>
    </div>
  </section>
</main>
</body>
</html>
